name: SayType
configs:
  Debug: debug
  Release: release
  Direct: release
options:
  bundleIdPrefix: com.nicolasfrugoni
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    from: 1.1.0
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    from: 0.17.5
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: VQDNM3C2SW
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.1.2"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SayType:
    type: application
    platform: macOS
    sources:
      - path: SayType
        excludes: ["Resources/CLI/**"]
      # The `saytype` command-line tool; the Homebrew cask links it into the PATH.
      - path: SayType/Resources/CLI/saytype
        buildPhase:
          copyFiles:
            destination: resources
            subpath: CLI
    dependencies:
      - package: ArgmaxOSS
        product: WhisperKit
      - package: ArgmaxOSS
        product: TTSKit
      - package: FluidAudio
        product: FluidAudio
    info:
      path: SayType/Support/Info.plist
      properties:
        CFBundleDisplayName: SayType
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSUIElement: true
        CFBundleURLTypes:
          - CFBundleURLName: com.nicolasfrugoni.saytype
            CFBundleURLSchemes: [saytype]
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: SayType listens while a text field is focused and turns your speech into text. Audio never leaves your Mac.
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nicolasfrugoni.saytype
        # Mac App Store build: sandboxed.
        CODE_SIGN_ENTITLEMENTS: SayType/Support/SayType.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Direct download build (outside the Mac App Store): no App Sandbox, so the
        # Accessibility API can see and type into text fields in other apps.
        Debug:
          CODE_SIGN_ENTITLEMENTS: SayType/Support/SayType-Direct.entitlements
        Direct:
          CODE_SIGN_ENTITLEMENTS: SayType/Support/SayType-Direct.entitlements
  SayTypeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - SayTypeTests
      - SayType/Vocabulary
      - SayType/STT
      - SayType/Audio
      - SayType/Commands
      - SayType/History
      - SayType/Profiles
      - SayType/AI/CleanupPrompts.swift
      - SayType/Automation/AutomationCommand.swift
      - SayType/Automation/CommandAlias.swift
      - SayType/App/Settings.swift
      - SayType/Transcribe/TranscriptFormats.swift
      - SayType/Transcribe/AudioDecoder.swift
    dependencies:
      - package: ArgmaxOSS
        product: WhisperKit
      - package: FluidAudio
        product: FluidAudio
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.nicolasfrugoni.saytype.tests
schemes:
  SayType:
    build:
      targets:
        SayType: all
    test:
      targets: [SayTypeTests]
