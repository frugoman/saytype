name: SayType
options:
  bundleIdPrefix: com.nicolasfrugoni
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    from: 1.1.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: VQDNM3C2SW
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SayType:
    type: application
    platform: macOS
    sources: [SayType]
    dependencies:
      - package: ArgmaxOSS
        product: WhisperKit
      - package: ArgmaxOSS
        product: TTSKit
    entitlements:
      path: SayType/Support/SayType.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.audio-input: true
        com.apple.security.network.client: true
    info:
      path: SayType/Support/Info.plist
      properties:
        CFBundleDisplayName: SayType
        LSApplicationCategoryType: public.app-category.productivity
        LSUIElement: true
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: SayType listens while a text field is focused and turns your speech into text. Audio never leaves your Mac.
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nicolasfrugoni.saytype
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  SayTypeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - SayTypeTests
      - SayType/Vocabulary
      - SayType/STT
      - SayType/Audio
      - SayType/App/Settings.swift
    dependencies:
      - package: ArgmaxOSS
        product: WhisperKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.nicolasfrugoni.saytype.tests
schemes:
  SayType:
    build:
      targets:
        SayType: all
    test:
      targets: [SayTypeTests]
